name: generate-snake

on:
  schedule:
    - cron: "0 2 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Aryan681
          outputs: |
            assets/snake.svg?palette=github-dark
            assets/snake-dark.svg?color_snake=#D97757&color_dots=#241E19,#3A2E25,#5C4839,#8A6650,#D97757

      - name: push generated files to a new branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
