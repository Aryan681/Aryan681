<svg width="100%" height="auto" viewBox="0 0 900 14" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0EEE6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#F0EEE6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Base background line -->
  <rect x="0" y="6" width="900" height="1.5" fill="#DCD6C7"/>
  
  <!-- Soft middle gradient highlight (centered) -->
