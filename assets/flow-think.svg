<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <style>.node{fill:#F0EEE6;stroke:#D9CFBB;stroke-width:1.5;} .lbl{fill:#30281F;font-size:13px;}</style>
  <line x1="60" y1="75" x2="840" y2="75" stroke="#DCD6C7" stroke-width="2"/>
  <g id="n1"><rect class="node" x="20" y="50" width="90" height="50" rx="8"/><text class="lbl" x="65" y="80" text-anchor="middle">IDEA</text></g>
  <g id="n2"><rect class="node" x="180" y="50" width="90" height="50" rx="8"/><text class="lbl" x="225" y="80" text-anchor="middle">BUILD</text></g>
  <g id="n3"><rect class="node" x="340" y="50" width="90" height="50" rx="8"/><text class="lbl" x="385" y="80" text-anchor="middle">BREAK</text></g>
  <g id="n4"><rect class="node" x="500" y="50" width="110" height="50" rx="8"/><text class="lbl" x="555" y="80" text-anchor="middle">DEBUG</text></g>
