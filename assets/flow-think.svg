<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <style>
      .node { fill:#241E19; stroke:#5C4839; stroke-width:1.5; }
      .lbl  { fill:#B9AFA3; font-size:13px; }
    </style>
  </defs>
  <!-- connecting line -->
  <line x1="60" y1="75" x2="840" y2="75" stroke="#3A2E25" stroke-width="2"/>

  <!-- nodes -->
  <g id="n1"><rect class="node" x="20" y="50" width="90" height="50" rx="8"/><text class="lbl" x="65" y="80" text-anchor="middle">IDEA</text></g>
  <g id="n2"><rect class="node" x="180" y="50" width="90" height="50" rx="8"/><text class="lbl" x="225" y="80" text-anchor="middle">BUILD</text></g>
  <g id="n3"><rect class="node" x="340" y="50" width="90" height="50" rx="8"/><text class="lbl" x="385" y="80" text-anchor="middle">BREAK</text></g>
  <g id="n4"><rect class="node" x="500" y="50" width="110" height="50" rx="8"/><text class="lbl" x="555" y="80" text-anchor="middle">DEBUG</text></g>
  <g id="n5"><rect class="node" x="660" y="50" width="130" height="50" rx="8"/><text class="lbl" x="725" y="80" text-anchor="middle">UNDERSTAND</text></g>

  <!-- traveling glow that lights each node in sequence, then loops back -->
  <circle r="7" fill="#D97757">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M65,75 L225,75 L385,75 L555,75 L725,75 L725,75" keyTimes="0;0.18;0.36;0.54;0.72;1" calcMode="discrete"/>
  </circle>

  <text x="450" y="135" fill="#8A7B6C" font-size="12" text-anchor="middle">then repeat — forever, on purpose</text>
</svg>
