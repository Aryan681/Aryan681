<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <!-- fill gradients -->
    <linearGradient id="fillA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B85C3A"/>
      <stop offset="100%" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="fillB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9C6B4E"/>
      <stop offset="100%" stop-color="#C08862"/>
    </linearGradient>

    <!-- diagonal stripe texture painted over the fill -->
    <pattern id="stripes" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="transparent"/>
      <rect width="8" height="16" fill="#ffffff" opacity="0.08"/>
    </pattern>

    <!-- shimmer sweep -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="b1"><rect x="0" y="0" width="0" height="22" rx="11"><animate attributeName="width" from="0" to="646" begin="0.2s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <clipPath id="b2"><rect x="0" y="0" width="0" height="22" rx="11"><animate attributeName="width" from="0" to="425" begin="0.5s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <clipPath id="track"><rect x="0" y="0" width="760" height="22" rx="11"/></clipPath>
  </defs>

  <!-- ── building ── -->
  <g font-size="14">
    <text x="0" y="20" fill="#D97757" font-weight="700">🔨 BUILDING</text>
    <text x="760" y="20" fill="#30281F" font-weight="700" text-anchor="end">
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.2s" fill="freeze"/>
      85%
    </text>

    <rect x="0" y="30" width="760" height="22" rx="11" fill="#E7E2D6"/>
    <rect x="0" y="30" width="760" height="22" rx="11" fill="none" stroke="#D9CFBB" stroke-width="1"/>

    <g clip-path="url(#b1)" transform="translate(0,30)">
      <rect width="760" height="22" fill="url(#fillA)"/>
      <g clip-path="url(#track)"><rect width="760" height="22" fill="url(#stripes)"/></g>
      <!-- traveling shimmer, loops after the bar fills -->
      <rect width="140" height="22" fill="url(#shimmer)">
        <animate attributeName="x" from="-140" to="900" begin="1.6s" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <!-- soft glow riding the leading edge while filling -->
      <circle cy="11" r="3" fill="#FBD9C4">
        <animate attributeName="cx" from="0" to="646" begin="0.2s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" begin="0.2s" dur="1.4s" fill="freeze"/>
      </circle>
    </g>

<text x="0" y="66" fill="#F0EEE6" font-size="12">identity security engine — authentication · sessions · token security · threat detection</text>
  </g>

  <!-- ── learning ── -->
  <g font-size="14" transform="translate(0,80)">
    <text x="0" y="20" fill="#D97757" font-weight="700">📚 LEARNING</text>
    <text x="760" y="20" fill="#30281F" font-weight="700" text-anchor="end">
      <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.2s" fill="freeze"/>
      56%
    </text>

    <rect x="0" y="30" width="760" height="22" rx="11" fill="#E7E2D6"/>
    <rect x="0" y="30" width="760" height="22" rx="11" fill="none" stroke="#D9CFBB" stroke-width="1"/>

    <g clip-path="url(#b2)" transform="translate(0,30)">
      <rect width="760" height="22" fill="url(#fillB)"/>
      <g clip-path="url(#track)"><rect width="760" height="22" fill="url(#stripes)"/></g>
      <rect width="140" height="22" fill="url(#shimmer)">
        <animate attributeName="x" from="-140" to="900" begin="1.9s" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <circle cy="11" r="3" fill="#F2DCC6">
        <animate attributeName="cx" from="0" to="425" begin="0.5s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" begin="0.5s" dur="1.4s" fill="freeze"/>
      </circle>
    </g>

    <text x="0" y="66" fill="#F0EEE6" font-size="12">distributed systems — Docker · Kubernetes · System Design</text>
  </g>

  <!-- ── exploring: indeterminate, no fixed % ── -->
  <g font-size="14" transform="translate(0,160)">
    <text x="0" y="20" fill="#D97757" font-weight="700">🔍 EXPLORING</text>
    <text x="760" y="20" fill="#F0EEE6" font-size="11" text-anchor="end" font-style="italic">always on</text>

    <rect x="0" y="30" width="760" height="14" rx="7" fill="#E7E2D6"/>
    <rect x="0" y="30" width="760" height="14" rx="7" fill="none" stroke="#D9CFBB" stroke-width="1"/>
    <g clip-path="url(#trackThin)">
    </g>
    <clipPath id="trackThin"><rect x="0" y="30" width="760" height="14" rx="7"/></clipPath>
    <g clip-path="url(#trackThin)">
      <rect y="30" width="120" height="14" fill="#D97757" opacity="0.8">
        <animate attributeName="x" values="-120;760" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
