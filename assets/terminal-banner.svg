<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1B17"/>
      <stop offset="100%" stop-color="#171310"/>
    </linearGradient>
    <clipPath id="l1"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="520" begin="0.2s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="600" begin="1.5s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="540" begin="2.8s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="470" begin="4.1s" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="640" begin="5.3s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <clipPath id="l6"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="560" begin="6.7s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="428" rx="14" fill="url(#bg)" stroke="#D97757" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="42" rx="14" fill="#241E19"/>
  <rect x="1" y="29" width="898" height="14" fill="#241E19"/>
  <circle cx="30" cy="22" r="6" fill="#D97757"/>
  <circle cx="52" cy="22" r="6" fill="#8A6650" opacity="0.6"/>
  <circle cx="74" cy="22" r="6" fill="#8A6650" opacity="0.6"/>
  <text x="450" y="27" fill="#B9AFA3" font-size="13" text-anchor="middle" letter-spacing="1">aryan@claude-code — session · zsh</text>

  <!-- prompt lines -->
  <g font-size="16" fill="#EDE7DE">
    <text x="34" y="90"><tspan fill="#D97757">➜ </tspan><tspan fill="#8FBFA0">~/aryan-singh</tspan><tspan fill="#EDE7DE"> git:(</tspan><tspan fill="#D97757">main</tspan><tspan fill="#EDE7DE">) claude --resume aryan</tspan></text>

    <g clip-path="url(#l1)"><text x="34" y="128" fill="#B9AFA3">⏺ session restored. loading context on Aryan Singh…</text></g>
    <g clip-path="url(#l2)"><text x="34" y="160" fill="#EDE7DE">⏺ Backend Engineer (Node.js) · B.Tech CSE, NIMS University, Jaipur '26</text></g>
    <g clip-path="url(#l3)"><text x="34" y="192" fill="#EDE7DE">⏺ Stack: Node · Express · PostgreSQL · MongoDB · Redis · RabbitMQ · Socket.io</text></g>
    <g clip-path="url(#l4)"><text x="34" y="224" fill="#EDE7DE">⏺ Currently building a real-time calling/social backend at production scale</text></g>
    <g clip-path="url(#l5)"><text x="34" y="256" fill="#EDE7DE">⏺ Winner — miniMide Hackathon (Healthcare) · Finalist — Level SuperMind</text></g>
    <g clip-path="url(#l6)"><text x="34" y="288" fill="#8FBFA0">✓ done. status: building. always debugging something on purpose.</text></g>
  </g>

  <!-- blinking cursor -->
  <rect x="34" y="308" width="10" height="18" fill="#D97757">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" begin="7.9s" repeatCount="indefinite"/>
  </rect>

  <!-- footer strip -->
  <rect x="1" y="396" width="898" height="33" rx="14" fill="#241E19"/>
  <rect x="1" y="396" width="898" height="14" fill="#241E19"/>
  <text x="34" y="417" fill="#8A7B6C" font-size="12">node --version · v20 LTS</text>
  <text x="866" y="417" fill="#8A7B6C" font-size="12" text-anchor="end">100% caffeinated</text>
</svg>
