<svg
  width="900"
  height="330"
  viewBox="0 0 900 330"
  xmlns="http://www.w3.org/2000/svg"
  font-family="JetBrains Mono, monospace"
>

  <defs>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- SUBTLE PIXEL / ROUGH PAPER EFFECT                              -->
    <!-- ═══════════════════════════════════════════════════════════════ -->

    <filter id="rough2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.035"
        numOctaves="2"
        result="n"
        seed="4"
      />

      <feDisplacementMap
        in="SourceGraphic"
        in2="n"
        scale="1.3"
      />
    </filter>


    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- SOFT CARD SHADOW                                                -->
    <!-- ═══════════════════════════════════════════════════════════════ -->

    <filter
      id="cardShadow"
      x="-40%"
      y="-40%"
      width="180%"
      height="180%"
    >
      <feDropShadow
        dx="2"
        dy="5"
        stdDeviation="4"
        flood-color="#30281F"
        flood-opacity="0.24"
      />
    </filter>


    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- LIGHT CLAUDE-STYLE CARD                                        -->
    <!-- ═══════════════════════════════════════════════════════════════ -->

    <linearGradient
      id="cardFill"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >

      <stop
        offset="0%"
        stop-color="#F0EEE6"
      />

      <stop
        offset="100%"
        stop-color="#E8E4D9"
      />

    </linearGradient>


    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- CLAUDE ORANGE PIN                                               -->
    <!-- ═══════════════════════════════════════════════════════════════ -->

    <radialGradient
      id="pinShine"
      cx="0.35"
      cy="0.3"
      r="0.8"
    >

      <stop
        offset="0%"
        stop-color="#F2A57C"
      />

      <stop
        offset="55%"
        stop-color="#D97757"
      />

      <stop
        offset="100%"
        stop-color="#A84D31"
      />

    </radialGradient>


    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- CARD SHAPE                                                      -->
    <!-- ═══════════════════════════════════════════════════════════════ -->

    <g id="cardShape">

      <!-- Main card -->
      <rect
        x="-90"
        y="-45"
        width="180"
        height="90"
        rx="5"
        fill="url(#cardFill)"
        filter="url(#rough2)"
      />

      <!-- Claude orange outline -->
      <rect
        x="-90"
        y="-45"
        width="180"
        height="90"
        rx="5"
        fill="none"
        stroke="#D97757"
        stroke-width="1"
        opacity="0.9"
        filter="url(#rough2)"
      />

      <!-- Subtle inner border -->
      <rect
        x="-86"
        y="-41"
        width="172"
        height="82"
        rx="3"
        fill="none"
        stroke="#30281F"
        stroke-width="0.5"
        opacity="0.08"
      />

    </g>


    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- PIN                                                             -->
    <!-- ═══════════════════════════════════════════════════════════════ -->

    <g id="pin">

      <circle
        r="6.5"
        fill="url(#pinShine)"
      />

      <circle
        r="6.5"
        fill="none"
        stroke="#8C4325"
        stroke-width="0.6"
        opacity="0.7"
      />

      <circle
        cx="-1.5"
        cy="-1.8"
        r="1.8"
        fill="#FBD9C4"
        opacity="0.9"
      />

    </g>

  </defs>


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!--                                                                  -->
  <!--                FULLY TRANSPARENT BACKGROUND                     -->
  <!--                                                                  -->
  <!-- ═══════════════════════════════════════════════════════════════ -->


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 1. BACKEND ARCHITECTURE                                          -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <g
    transform="translate(120,72) rotate(-6)"
    opacity="0"
  >

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0s"
      dur="0.3s"
      fill="freeze"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      additive="sum"
      from="0,-40"
      to="0,0"
      begin="0s"
      dur="0.5s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.3 1.6 0.4 1"
    />

    <g filter="url(#cardShadow)">
      <use href="#cardShape"/>
    </g>

    <text
      x="0"
      y="-8"
      font-size="22"
      text-anchor="middle"
      fill="#30281F"
    >⚙</text>

    <text
      x="0"
      y="16"
      font-size="12.5"
      font-weight="700"
      fill="#30281F"
      text-anchor="middle"
    >Backend Architecture</text>

  </g>

  <use
    href="#pin"
    x="120"
    y="30"
  />


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 2. DATABASE DESIGN                                               -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <g
    transform="translate(335,55) rotate(4)"
    opacity="0"
  >

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.1s"
      dur="0.3s"
      fill="freeze"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      additive="sum"
      from="0,-40"
      to="0,0"
      begin="0.1s"
      dur="0.5s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.3 1.6 0.4 1"
    />

    <g filter="url(#cardShadow)">
      <use href="#cardShape"/>
    </g>

    <text
      x="0"
      y="-8"
      font-size="22"
      text-anchor="middle"
      fill="#30281F"
    >▣</text>

    <text
      x="0"
      y="16"
      font-size="12.5"
      font-weight="700"
      fill="#30281F"
      text-anchor="middle"
    >Database Design</text>

  </g>

  <use
    href="#pin"
    x="335"
    y="13"
  />


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 3. PERFORMANCE & CACHING                                        -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <g
    transform="translate(560,78) rotate(-3)"
    opacity="0"
  >

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.2s"
      dur="0.3s"
      fill="freeze"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      additive="sum"
      from="0,-40"
      to="0,0"
      begin="0.2s"
      dur="0.5s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.3 1.6 0.4 1"
    />

    <g filter="url(#cardShadow)">
      <use href="#cardShape"/>
    </g>

    <text
      x="0"
      y="-8"
      font-size="22"
      text-anchor="middle"
      fill="#30281F"
    >⚡</text>

    <text
      x="0"
      y="16"
      font-size="12.5"
      font-weight="700"
      fill="#30281F"
      text-anchor="middle"
    >Performance &amp; Caching</text>

  </g>

  <use
    href="#pin"
    x="560"
    y="36"
  />


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 4. MESSAGE QUEUES                                                -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <g
    transform="translate(775,60) rotate(6)"
    opacity="0"
  >

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.3s"
      dur="0.3s"
      fill="freeze"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      additive="sum"
      from="0,-40"
      to="0,0"
      begin="0.3s"
      dur="0.5s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.3 1.6 0.4 1"
    />

    <g filter="url(#cardShadow)">
      <use href="#cardShape"/>
    </g>

    <text
      x="0"
      y="-8"
      font-size="22"
      text-anchor="middle"
      fill="#30281F"
    >⇢</text>

    <text
      x="0"
      y="16"
      font-size="12.5"
      font-weight="700"
      fill="#30281F"
      text-anchor="middle"
    >Message Queues</text>

  </g>

  <use
    href="#pin"
    x="775"
    y="18"
  />


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 5. AUTH & SECURITY                                               -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <g
    transform="translate(115,225) rotate(5)"
    opacity="0"
  >

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.4s"
      dur="0.3s"
      fill="freeze"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      additive="sum"
      from="0,-40"
      to="0,0"
      begin="0.4s"
      dur="0.5s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.3 1.6 0.4 1"
    />

    <g filter="url(#cardShadow)">
      <use href="#cardShape"/>
    </g>

    <text
      x="0"
      y="-8"
      font-size="22"
      text-anchor="middle"
      fill="#30281F"
    >◆</text>

    <text
      x="0"
      y="16"
      font-size="12.5"
      font-weight="700"
      fill="#30281F"
      text-anchor="middle"
    >Auth &amp; Security</text>

  </g>

  <use
    href="#pin"
    x="115"
    y="183"
  />


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 6. INFRASTRUCTURE                                                -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <g
    transform="translate(335,242) rotate(-5)"
    opacity="0"
  >

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.5s"
      dur="0.3s"
      fill="freeze"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      additive="sum"
      from="0,-40"
      to="0,0"
      begin="0.5s"
      dur="0.5s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.3 1.6 0.4 1"
    />

    <g filter="url(#cardShadow)">
      <use href="#cardShape"/>
    </g>

    <text
      x="0"
      y="-8"
      font-size="22"
      text-anchor="middle"
      fill="#30281F"
    >☁</text>

    <text
      x="0"
      y="16"
      font-size="12.5"
      font-weight="700"
      fill="#30281F"
      text-anchor="middle"
    >Infrastructure</text>

  </g>

  <use
    href="#pin"
    x="335"
    y="200"
  />


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 7. DISTRIBUTED SYSTEMS                                           -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <g
    transform="translate(560,222) rotate(3)"
    opacity="0"
  >

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.6s"
      dur="0.3s"
      fill="freeze"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      additive="sum"
      from="0,-40"
      to="0,0"
      begin="0.6s"
      dur="0.5s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.3 1.6 0.4 1"
    />

    <g filter="url(#cardShadow)">
      <use href="#cardShape"/>
    </g>

    <text
      x="0"
      y="-8"
      font-size="22"
      text-anchor="middle"
      fill="#30281F"
    >◎</text>

    <text
      x="0"
      y="16"
      font-size="12.5"
      font-weight="700"
      fill="#30281F"
      text-anchor="middle"
    >Distributed Systems</text>

  </g>

  <use
    href="#pin"
    x="560"
    y="180"
  />


  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 8. SYSTEM DESIGN                                                 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <g
    transform="translate(775,240) rotate(-4)"
    opacity="0"
  >

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.7s"
      dur="0.3s"
      fill="freeze"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      additive="sum"
      from="0,-40"
      to="0,0"
      begin="0.7s"
      dur="0.5s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.3 1.6 0.4 1"
    />

    <g filter="url(#cardShadow)">
      <use href="#cardShape"/>
    </g>

    <text
      x="0"
      y="-8"
      font-size="22"
      text-anchor="middle"
      fill="#30281F"
    >◇</text>

    <text
      x="0"
      y="16"
      font-size="12.5"
      font-weight="700"
      fill="#30281F"
      text-anchor="middle"
    >System Design</text>

  </g>

  <use
    href="#pin"
    x="775"
    y="198"
  />

</svg>
