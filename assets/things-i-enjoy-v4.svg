<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#30281F" flood-opacity="0.22"/>
    </filter>
    <g id="pin">
      <circle r="6" fill="#D97757"/>
      <circle r="2.2" fill="#F2C4A8"/>
    </g>
  </defs>

  <!-- faint corkboard texture -->
  <rect width="900" height="330" fill="#E7E2D6" opacity="0.4"/>
  <g opacity="0.06">
    <circle cx="60" cy="40" r="2" fill="#5B4636"/><circle cx="140" cy="90" r="2" fill="#5B4636"/>
    <circle cx="260" cy="30" r="2" fill="#5B4636"/><circle cx="400" cy="70" r="2" fill="#5B4636"/>
    <circle cx="600" cy="50" r="2" fill="#5B4636"/><circle cx="740" cy="90" r="2" fill="#5B4636"/>
    <circle cx="850" cy="40" r="2" fill="#5B4636"/><circle cx="100" cy="250" r="2" fill="#5B4636"/>
    <circle cx="320" cy="280" r="2" fill="#5B4636"/><circle cx="560" cy="260" r="2" fill="#5B4636"/>
    <circle cx="780" cy="290" r="2" fill="#5B4636"/>
  </g>

  <!-- card template -->
  <g id="tpl">
    <rect x="-90" y="-45" width="180" height="90" rx="4" fill="#F0EEE6" filter="url(#cardShadow)"/>
    <rect x="-90" y="-45" width="180" height="90" rx="4" fill="none" stroke="#D9CFBB" stroke-width="1"/>
  </g>

  <!-- ══ 8 pinned cards, each independently rotated + dropped in ══ -->

  <g transform="translate(120,72) rotate(-6)" opacity="0" filter="url(#rough2)">
    <animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0,-40" to="0,0" begin="0.0s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.6 0.4 1"/>
    <use href="#tpl"/>
    <text x="0" y="-8" font-size="22" text-anchor="middle">⚙️</text>
    <text x="0" y="16" font-size="12.5" font-weight="700" fill="#30281F" text-anchor="middle">Backend Architecture</text>
  </g>
  <use href="#pin" x="120" y="30"/>

  <g transform="translate(335,55) rotate(4)" opacity="0" filter="url(#rough2)">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0,-40" to="0,0" begin="0.1s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.6 0.4 1"/>
    <use href="#tpl"/>
    <text x="0" y="-8" font-size="22" text-anchor="middle">🗄️</text>
    <text x="0" y="16" font-size="12.5" font-weight="700" fill="#30281F" text-anchor="middle">Database Design</text>
  </g>
  <use href="#pin" x="335" y="13"/>

  <g transform="translate(560,78) rotate(-3)" opacity="0" filter="url(#rough2)">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0,-40" to="0,0" begin="0.2s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.6 0.4 1"/>
    <use href="#tpl"/>
    <text x="0" y="-8" font-size="22" text-anchor="middle">⚡</text>
    <text x="0" y="16" font-size="12.5" font-weight="700" fill="#30281F" text-anchor="middle">Performance &amp; Caching</text>
  </g>
  <use href="#pin" x="560" y="36"/>

  <g transform="translate(775,60) rotate(6)" opacity="0" filter="url(#rough2)">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0,-40" to="0,0" begin="0.3s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.6 0.4 1"/>
    <use href="#tpl"/>
    <text x="0" y="-8" font-size="22" text-anchor="middle">📨</text>
    <text x="0" y="16" font-size="12.5" font-weight="700" fill="#30281F" text-anchor="middle">Message Queues</text>
  </g>
  <use href="#pin" x="775" y="18"/>

  <g transform="translate(115,225) rotate(5)" opacity="0" filter="url(#rough2)">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0,-40" to="0,0" begin="0.4s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.6 0.4 1"/>
    <use href="#tpl"/>
    <text x="0" y="-8" font-size="22" text-anchor="middle">🔐</text>
    <text x="0" y="16" font-size="12.5" font-weight="700" fill="#30281F" text-anchor="middle">Auth &amp; Security</text>
  </g>
  <use href="#pin" x="115" y="183"/>

  <g transform="translate(335,242) rotate(-5)" opacity="0" filter="url(#rough2)">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0,-40" to="0,0" begin="0.5s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.6 0.4 1"/>
    <use href="#tpl"/>
    <text x="0" y="-8" font-size="22" text-anchor="middle">☁️</text>
    <text x="0" y="16" font-size="12.5" font-weight="700" fill="#30281F" text-anchor="middle">Infrastructure</text>
  </g>
  <use href="#pin" x="335" y="200"/>

  <g transform="translate(560,222) rotate(3)" opacity="0" filter="url(#rough2)">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0,-40" to="0,0" begin="0.6s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.6 0.4 1"/>
    <use href="#tpl"/>
    <text x="0" y="-8" font-size="22" text-anchor="middle">🌐</text>
    <text x="0" y="16" font-size="12.5" font-weight="700" fill="#30281F" text-anchor="middle">Distributed Systems</text>
  </g>
  <use href="#pin" x="560" y="180"/>

  <g transform="translate(775,240) rotate(-4)" opacity="0" filter="url(#rough2)">
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0,-40" to="0,0" begin="0.7s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.6 0.4 1"/>
    <use href="#tpl"/>
    <text x="0" y="-8" font-size="22" text-anchor="middle">🧠</text>
    <text x="0" y="16" font-size="12.5" font-weight="700" fill="#30281F" text-anchor="middle">System Design</text>
  </g>
  <use href="#pin" x="775" y="198"/>
</svg>
