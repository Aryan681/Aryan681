<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <line x1="60" y1="30" x2="60" y2="170" stroke="#DCD6C7" stroke-width="2"/>
 <!-- Timeline Nodes and Texts -->
<g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="500">
  <circle cx="60" cy="30" r="6" fill="#D97757"/>
  <text x="80" y="35" fill="#F0EEE6">2022 — Computer Science begins</text>

  <circle cx="60" cy="65" r="6" fill="#D97757"/>
  <text x="80" y="70" fill="#F0EEE6">2023 — Web dev: JS, React, Node</text>

  <circle cx="60" cy="100" r="6" fill="#D97757"/>
  <text x="80" y="105" fill="#F0EEE6">2024 — Backend: REST APIs, Mongo, Postgres</text>

  <circle cx="60" cy="135" r="6" fill="#D97757"/>
  <text x="80" y="140" fill="#F0EEE6">2025 — Real systems: Redis, RabbitMQ, Docker</text>

  <circle cx="60" cy="170" r="6" fill="#8FBFA0"/>
  <text x="80" y="175" fill="#F0EEE6">2026 — Going deeper: distributed systems, security</text>
</g>

  <circle r="8" fill="#D97757">
    <animate attributeName="cy" values="30;30;65;65;100;100;135;135;170;170" keyTimes="0;0.15;0.2;0.35;0.4;0.55;0.6;0.75;0.8;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="60" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
