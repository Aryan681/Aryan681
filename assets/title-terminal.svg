<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <path id="paper" d="M15,20
      L60,8 L110,22 L160,6 L210,20 L260,10 L310,22 L360,8 L410,20 L460,6
      L510,22 L560,8 L610,20 L660,10 L710,22 L760,8 L810,20 L860,10 L885,24
      L878,60 L888,100 L876,140 L886,180 L874,220 L884,260 L872,300 L882,335
      L860,352 L810,368 L760,354 L710,370 L660,356 L610,368 L560,354 L510,368
      L460,356 L410,368 L360,354 L310,368 L260,356 L210,368 L160,354 L110,368
      L60,356 L18,372 L10,336 L20,300 L8,262 L18,224 L6,186 L16,148 L4,110 L14,72 Z"
      fill="#F0EEE6" stroke="#D97757" stroke-width="3"/>
    <clipPath id="clip"><use href="#paper"/></clipPath>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
  </defs>

  <!-- paper base: pops in first -->
  <g transform-origin="450 200">
    <animateTransform attributeName="transform" type="scale" from="0.9" to="1" begin="0s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
    <use href="#paper"/>
  </g>

  <!-- ruled notebook lines: draw on one by one -->
  <g clip-path="url(#clip)" stroke="#D9CFBB" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.3s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="64" x2="900" y2="64" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.34s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="88" x2="900" y2="88" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.38s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="112" x2="900" y2="112" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.42s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="136" x2="900" y2="136" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.46s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="160" x2="900" y2="160" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.5s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="184" x2="900" y2="184" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.54s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="208" x2="900" y2="208" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.58s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="232" x2="900" y2="232" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.62s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="256" x2="900" y2="256" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.66s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="280" x2="900" y2="280" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.7s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="304" x2="900" y2="304" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.74s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="328" x2="900" y2="328" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.78s" dur="0.5s" fill="freeze"/></line>
    <line x1="0" y1="352" x2="900" y2="352" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" begin="0.82s" dur="0.5s" fill="freeze"/></line>
  </g>

  <!-- doodles: sketched in after the lines -->
  <g clip-path="url(#clip)" stroke="#8A8578" stroke-width="1.4" fill="none" filter="url(#rough)" opacity="0">
    <animate attributeName="opacity" from="0" to="0.55" begin="1.1s" dur="0.6s" fill="freeze"/>
    <path d="M40,50 l14,14 l-14,14 M64,78 h16"/>
    <path d="M780,45 l14,14 l-14,14 M804,73 h16"/>
    <path d="M55,300 l14,14 l-14,14 M79,328 h16"/>
    <path d="M800,290 l14,14 l-14,14 M824,318 h16"/>
    <path d="M30,150 L20,150 20,250 30,250"/>
    <path d="M860,140 L870,140 870,240 860,240"/>
    <circle cx="45" cy="200" r="10"/>
    <circle cx="850" cy="190" r="10"/>
    <path d="M20,340 h-8 M20,346 h-14 M20,352 h-10"/>
  </g>

  <!-- ARYAN: pops in with a little overshoot -->
  <g text-anchor="middle" filter="url(#rough)" transform="rotate(-1.5 450 188)" opacity="0">
    <animateTransform attributeName="transform" type="scale" additive="sum" from="0.4" to="1" begin="1.4s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.34 1.4 0.4 1" transform-origin="450 188"/>
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
    <text x="450" y="188" font-size="92" font-weight="900" fill="#30281F" letter-spacing="2">ARYAN</text>
    <text x="450" y="188" font-size="92" font-weight="900" fill="#D97757" letter-spacing="2" stroke="#30281F" stroke-width="2.5" paint-order="stroke">ARYAN</text>
  </g>

  <!-- SINGH: pops in slightly after -->
  <g text-anchor="middle" filter="url(#rough)" transform="rotate(-1.5 450 272)" opacity="0">
    <animateTransform attributeName="transform" type="scale" additive="sum" from="0.4" to="1" begin="1.75s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.34 1.4 0.4 1" transform-origin="450 272"/>
    <animate attributeName="opacity" from="0" to="1" begin="1.75s" dur="0.3s" fill="freeze"/>
    <text x="450" y="272" font-size="92" font-weight="900" fill="#30281F" letter-spacing="2">SINGH</text>
    <text x="450" y="272" font-size="92" font-weight="900" fill="#D97757" letter-spacing="2" stroke="#30281F" stroke-width="2.5" paint-order="stroke">SINGH</text>
  </g>

  <!-- subtitle: types in letter by letter via clip reveal -->
  <defs>
    <clipPath id="subclip"><rect x="0" y="0" width="0" height="40" y2="300"><animate attributeName="width" from="0" to="700" begin="2.2s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
  </defs>
  <g text-anchor="middle" clip-path="url(#subclip)" transform="translate(100,300)">
    <text x="350" y="22" font-size="26" font-weight="700" fill="#30281F" letter-spacing="12">BACKEND ENGINEER</text>
  </g>

  <!-- blinking cursor after subtitle finishes typing -->
  <rect x="742" y="308" width="12" height="20" fill="#D97757" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;0.01;0.5;0.51;0.99;1" begin="3.1s" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
