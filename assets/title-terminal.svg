<svg width="100%" height="auto" viewBox="0 0 460 64" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Menlo, Consolas, monospace">
  <defs>
    <!-- Smooth text typing reveal animation matrix -->
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="64">
        <animate attributeName="width" from="0" to="460" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Premium Charcoal Window Frame Container Base -->
  <rect x="1" y="1" width="458" height="62" rx="12" fill="#1F1B17" stroke="#D97757" stroke-width="1.2"/>
  
  <!-- Left Side Accent Brand Margin Edge Segment -->
  <rect x="1" y="1" width="5" height="62" rx="3" fill="#D97757"/>

  
  <g clip-path="url(#reveal)" font-size="16" font-weight="600" letter-spacing="0.3">
    <text x="24" y="37">
      <tspan fill="#D97757">⏺ </tspan>
      <tspan fill="#EDE7DE"> aryan@claude-code ~ $</tspan>
    </text>
  </g>

  <!-- Pulse Status Anchor Loop Dot Component -->
  <circle cx="432" cy="32" r="5" fill="#D97757">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite" calcMode="linear"/>
  </circle>
</svg>
