<svg width="240" height="64" viewBox="0 0 340 64" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <clipPath id="reveal"><rect x="0" y="0" width="0" height="64"><animate attributeName="width" from="0" to="340" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
  </defs>
  <rect x="0" y="0" width="340" height="64" rx="10" fill="#F0EEE6"/>
  <rect x="0" y="0" width="6" height="64" rx="3" fill="#D97757"/>
  <g clip-path="url(#reveal)">
    <text x="34" y="40" font-size="22" font-weight="700" fill="#30281F" letter-spacing="0.5">⏺  HOW I THINK</text>
  </g>
  <circle cx="314" cy="32" r="6" fill="#D97757">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
