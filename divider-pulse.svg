<svg width="900" height="18" viewBox="0 0 900 18" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F1B17"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#1F1B17"/>
    </linearGradient>
  </defs>
  <rect x="0" y="8" width="900" height="2" fill="#3A2E25"/>
  <rect y="8" width="140" height="2" fill="url(#g)">
    <animate attributeName="x" from="-140" to="900" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <circle cy="9" r="3.5" fill="#D97757">
    <animate attributeName="cx" from="-10" to="910" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
