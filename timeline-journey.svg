<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <line x1="60" y1="30" x2="60" y2="170" stroke="#3A2E25" stroke-width="2"/>

  <g font-size="13" fill="#EDE7DE">
    <circle cx="60" cy="30" r="6" fill="#5C4839"/><text x="80" y="35">2022 — Computer Science begins</text>
    <circle cx="60" cy="65" r="6" fill="#5C4839"/><text x="80" y="70">2023 — Web dev: JS, React, Node</text>
    <circle cx="60" cy="100" r="6" fill="#5C4839"/><text x="80" y="105">2024 — Backend: REST APIs, Mongo, Postgres</text>
    <circle cx="60" cy="135" r="6" fill="#5C4839"/><text x="80" y="140">2025 — Real systems: Redis, RabbitMQ, Docker</text>
    <circle cx="60" cy="170" r="6" fill="#5C4839"/><text x="80" y="175">2026 — Going deeper: distributed systems, security</text>
  </g>

  <!-- traveling marker that lights each year as it passes -->
  <circle r="8" fill="#D97757">
    <animate attributeName="cy" values="30;30;65;65;100;100;135;135;170;170" keyTimes="0;0.15;0.2;0.35;0.4;0.55;0.6;0.75;0.8;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="60" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
